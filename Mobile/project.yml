name: AizenMobile
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  AizenCore:
    path: ../Packages/Core
  AizenWire:
    path: ../Packages/Wire
  AizenClient:
    path: ../Packages/Client
  AizenSecurity:
    path: ../Packages/Security
  AizenTransport:
    path: ../Packages/Transport
targets:
  AizenMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.aizen.mobile
        PRODUCT_NAME: Aizen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aizen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: AizenCore
        product: AizenCore
      - package: AizenWire
        product: AizenWire
      - package: AizenClient
        product: AizenClient
      - package: AizenSecurity
        product: AizenSecurity
      - package: AizenTransport
        product: AizenTransport
