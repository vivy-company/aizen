syntax = "proto3";

package aizen.wire.v1;

option swift_prefix = "AizenWireV1_";

message ProtocolEnvelope {
  uint32 protocol_generation = 1;
  string message_id = 2;
  string connection_id = 3;
  uint64 connection_sequence = 4;
  MessageKind kind = 5;
  LogicalChannel channel = 6;
  string correlation_id = 7;
  Acknowledgement acknowledgement = 8;
  TypedPayload payload = 9;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_HELLO = 1;
  MESSAGE_KIND_AUTHENTICATION = 2;
  MESSAGE_KIND_CAPABILITIES = 3;
  MESSAGE_KIND_COMMAND = 4;
  MESSAGE_KIND_COMMAND_RECEIPT = 5;
  MESSAGE_KIND_COMMAND_RESULT = 6;
  MESSAGE_KIND_QUERY = 7;
  MESSAGE_KIND_QUERY_RESPONSE = 8;
  MESSAGE_KIND_SNAPSHOT = 9;
  MESSAGE_KIND_EVENT = 10;
  MESSAGE_KIND_EVENT_ACKNOWLEDGEMENT = 11;
  MESSAGE_KIND_PING = 12;
  MESSAGE_KIND_PONG = 13;
  MESSAGE_KIND_CLOSE = 14;
  MESSAGE_KIND_BLOB = 15;
  MESSAGE_KIND_ERROR = 16;
}

enum LogicalChannel {
  LOGICAL_CHANNEL_UNSPECIFIED = 0;
  LOGICAL_CHANNEL_CONTROL = 1;
  LOGICAL_CHANNEL_STATE = 2;
  LOGICAL_CHANNEL_RUN_STREAM = 3;
  LOGICAL_CHANNEL_TERMINAL = 4;
  LOGICAL_CHANNEL_BLOB = 5;
}

enum PayloadEncoding {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_PROTOBUF = 1;
}

message Acknowledgement {
  uint64 sequence = 1;
  string message_id = 2;
}

message TypedPayload {
  string type = 1;
  uint32 schema_version = 2;
  PayloadEncoding encoding = 3;
  bytes bytes = 4;
  bool state_affecting = 5;
}

message Hello {
  uint32 minimum_protocol_generation = 1;
  uint32 maximum_protocol_generation = 2;
  string product_version = 3;
}

message Capabilities {
  repeated string identifiers = 1;
  uint32 minimum_protocol_generation = 2;
  uint32 maximum_protocol_generation = 3;
  string product_version = 4;
  string minimum_compatible_product_version = 5;
}

message AuthenticationStart {
  string host_id = 1;
  string device_id = 2;
  string connection_id = 3;
  bytes client_nonce = 4;
  bytes device_signing_public_key = 5;
  bytes device_key_agreement_public_key = 6;
  bytes client_ephemeral_public_key = 7;
  string route = 8;
}

message AuthenticationChallenge {
  string host_id = 1;
  string device_id = 2;
  string connection_id = 3;
  bytes client_nonce = 4;
  bytes server_nonce = 5;
  bytes host_signing_public_key = 6;
  bytes host_key_agreement_public_key = 7;
  bytes server_ephemeral_public_key = 8;
  string route = 9;
  bytes host_signature = 10;
}

message AuthenticationProof {
  string connection_id = 1;
  bytes device_signature = 2;
}

// Sent only during first-device pairing. The Host must hold this request pending
// until a local approval boundary explicitly creates the Device authorization.
message PairingRequest {
  string token_id = 1;
  bytes pairing_secret = 2;
  string host_id = 3;
  string device_id = 4;
  string device_display_name = 5;
  string device_platform = 6;
  bytes device_signing_public_key = 7;
  bytes device_key_agreement_public_key = 8;
  string route = 9;
}

message PairingPending {
  string token_id = 1;
}

// These management payloads are accepted only by the signed local Host client.
message ListPendingPairingRequestsQuery {}

message PendingPairingRequestRecord {
  string token_id = 1;
  string device_id = 2;
  string device_display_name = 3;
  string device_platform = 4;
  string fingerprint = 5;
  string route = 6;
  int64 received_at_unix_milliseconds = 7;
}

message ListPendingPairingRequestsResponse {
  repeated PendingPairingRequestRecord requests = 1;
}

message ApprovePairingRequestCommand {
  string token_id = 1;
  repeated string capabilities = 2;
}

message RejectPairingRequestCommand {
  string token_id = 1;
}

message PairingApprovalResult {
  string device_id = 1;
}

message CommandReceipt {
  string command_id = 1;
  string operation_id = 2;
}

message CommandResult {
  string command_id = 1;
  bool succeeded = 2;
  string error_code = 3;
}

message HostError {
  string code = 1;
  string message = 2;
}

message CreateSpaceCommand {
  string name = 1;
  string icon = 2;
  string summary = 3;
}

message CreateSpaceResult {
  string space_id = 1;
}

message RenameSpaceCommand {
  string space_id = 1;
  string name = 2;
}

message DeleteSpaceCommand {
  string space_id = 1;
}

message SpaceMutationResult {}

message CreateConversationCommand {
  string space_id = 1;
  string title = 2;
}

message CreateConversationResult {
  string session_id = 1;
}

message SendConversationCommand {
  string space_id = 1;
  string session_id = 2;
  string message_id = 3;
  string run_id = 4;
  string content = 5;
}

message SendConversationResult {
  string run_id = 1;
}

message CancelRunCommand {
  string run_id = 1;
}

message CancelRunResult {}

message ConfigureAgentLaunchCommand {
  string executable_path = 1;
  repeated string arguments = 2;
  map<string, string> environment = 3;
}

message ConfigureAgentLaunchResult {}

message RunEvent {
  string event_id = 1;
  uint64 sequence = 2;
  string space_id = 3;
  string session_id = 4;
  string run_id = 5;
  oneof kind {
    string lifecycle = 6;
    string assistant_text_delta = 7;
  }
}

message ListSpacesQuery {}

message SpaceRecord {
  string space_id = 1;
  string name = 2;
  string icon = 3;
  string summary = 4;
}

message ListSpacesResponse {
  repeated SpaceRecord spaces = 1;
}

message ListConversationsQuery {
  string space_id = 1;
}

message ConversationRecord {
  string session_id = 1;
  string space_id = 2;
  string title = 3;
  string lifecycle = 4;
}

message ListConversationsResponse {
  repeated ConversationRecord conversations = 1;
}

message GetConversationTimelineQuery {
  string session_id = 1;
}

message ConversationMessageRecord {
  string message_id = 1;
  string space_id = 2;
  string session_id = 3;
  string run_id = 4;
  string role = 5;
  string content = 6;
  int64 created_at_millis = 7;
}

message GetConversationTimelineResponse {
  repeated ConversationMessageRecord messages = 1;
}

message ListRunsQuery {
  string space_id = 1;
}

message RunRecord {
  string run_id = 1;
  string space_id = 2;
  string session_id = 3;
  string execution_context_id = 4;
  string lifecycle = 5;
}

message ListRunsResponse {
  repeated RunRecord runs = 1;
}

message ListOperationsQuery {
  string space_id = 1;
  string operation_id = 2;
}

message OperationRecord {
  string operation_id = 1;
  string space_id = 2;
  string session_id = 3;
  string lifecycle = 4;
  double progress = 5;
  bool has_progress = 6;
  string failure_description = 7;
}

message ListOperationsResponse {
  repeated OperationRecord operations = 1;
}

message ListResourcesQuery {
  string space_id = 1;
}

message ResourceRecord {
  string resource_id = 1;
  string space_id = 2;
  string kind = 3;
  string title = 4;
  bytes details_json = 5;
}

message ListResourcesResponse {
  repeated ResourceRecord resources = 1;
}

message DiscoverXcodeProjectQuery {
  string resource_id = 1;
}

message XcodeProjectDescriptorRecord {
  string resource_id = 1;
  string id = 2;
  string name = 3;
  string kind = 4;
  repeated string schemes = 5;
}

message DiscoverXcodeProjectResponse {
  optional XcodeProjectDescriptorRecord project = 1;
}

message OpenXcodeProjectCommand {
  string resource_id = 1;
  string project_id = 2;
}

message OpenXcodeProjectResult {}

message BuildXcodeProjectCommand {
  string resource_id = 1;
  string project_id = 2;
  string scheme = 3;
  string destination = 4;
}

message BuildXcodeProjectResult {
  string operation_id = 1;
}

message CancelOperationCommand {
  string operation_id = 1;
}

message CancelOperationResult {
  string operation_id = 1;
}

message ImportLocalFolderCommand {
  string space_id = 1;
  string path = 2;
  string title = 3;
}

message ImportLocalRepositoryCommand {
  string space_id = 1;
  string path = 2;
  optional string title = 3;
}

message ImportLocalRepositoryResult {
  string resource_id = 1;
}

message ImportLocalFolderResult {
  string resource_id = 1;
}

message ImportWebResourceCommand {
  string space_id = 1;
  string url = 2;
  optional string title = 3;
}

message ImportWebResourceResult {
  string resource_id = 1;
}

message RemoveResourceCommand {
  string resource_id = 1;
}

message ResourceMutationResult {}

message RefreshRepositoryResourceCommand {
  string resource_id = 1;
}

message RefreshRepositoryResourceResult {
  string resource_id = 1;
  string availability = 2;
  optional string branch = 3;
  bool is_detached = 4;
  bool has_submodules = 5;
  bool is_rebase_in_progress = 6;
}

message ReadRepositoryStatusQuery {
  string resource_id = 1;
  uint32 maximum_entries = 2;
}

message RepositoryStatusEntry {
  string path = 1;
  string index_status = 2;
  string worktree_status = 3;
}

message ReadRepositoryStatusResponse {
  string resource_id = 1;
  string repository_revision = 2;
  string index_revision = 3;
  repeated RepositoryStatusEntry entries = 4;
  bool truncated = 5;
}

message ReadRepositoryDiffQuery {
  string resource_id = 1;
  string relative_path = 2;
  uint32 maximum_bytes = 3;
}

message ReadRepositoryDiffResponse {
  string resource_id = 1;
  string repository_revision = 2;
  string index_revision = 3;
  bytes unified_diff = 4;
  bool truncated = 5;
}

message ReadRepositoryHistoryQuery {
  string resource_id = 1;
  uint32 maximum_commits = 2;
}

message RepositoryCommitRecord {
  string revision = 1;
  string subject = 2;
  string author_name = 3;
  int64 authored_at_unix_milliseconds = 4;
}

message ReadRepositoryHistoryResponse {
  string resource_id = 1;
  string repository_revision = 2;
  string index_revision = 3;
  string branch = 4;
  bool is_detached = 5;
  repeated RepositoryCommitRecord commits = 6;
  bool truncated = 7;
}

message UpdateRepositoryIndexCommand {
  string resource_id = 1;
  repeated string relative_paths = 2;
  string expected_index_revision = 3;
  bool stage = 4;
}

message UpdateRepositoryIndexResult {
  string index_revision = 1;
  string operation_id = 2;
}

message ReadRepositoryBranchesQuery {
  string resource_id = 1;
  uint32 maximum_branches = 2;
}

message RepositoryBranchRecord {
  string name = 1;
  string revision = 2;
  bool is_current = 3;
}

message ReadRepositoryBranchesResponse {
  string resource_id = 1;
  string repository_revision = 2;
  string index_revision = 3;
  repeated RepositoryBranchRecord branches = 4;
  bool truncated = 5;
}

message CommitRepositoryCommand {
  string resource_id = 1;
  string message = 2;
  string expected_repository_revision = 3;
  string expected_index_revision = 4;
  bool amend = 5;
}

message CommitRepositoryResult {
  string repository_revision = 1;
  string index_revision = 2;
  string operation_id = 3;
}

message UpdateRepositoryBranchCommand {
  string resource_id = 1;
  string branch_name = 2;
  string expected_repository_revision = 3;
  string expected_index_revision = 4;
  bool create = 5;
}

message UpdateRepositoryBranchResult {
  string repository_revision = 1;
  string index_revision = 2;
  string operation_id = 3;
}

message FetchRepositoryCommand {
  string resource_id = 1;
  string expected_repository_revision = 2;
  string expected_index_revision = 3;
}

message FetchRepositoryResult {
  string repository_revision = 1;
  string index_revision = 2;
  string operation_id = 3;
}

message PullRepositoryCommand {
  string resource_id = 1;
  string expected_repository_revision = 2;
  string expected_index_revision = 3;
}

message PullRepositoryResult {
  string repository_revision = 1;
  string index_revision = 2;
  string operation_id = 3;
}

message PushRepositoryCommand {
  string resource_id = 1;
  string expected_repository_revision = 2;
  string expected_index_revision = 3;
}

message PushRepositoryResult {
  string repository_revision = 1;
  string index_revision = 2;
  string operation_id = 3;
}

message ListExecutionContextsQuery {
  string space_id = 1;
  string resource_id = 2;
}

message ExecutionContextRecord {
  string execution_context_id = 1;
  string space_id = 2;
  string resource_id = 3;
  string kind = 4;
}

message ListExecutionContextsResponse {
  repeated ExecutionContextRecord contexts = 1;
}

message ListTerminalSessionsQuery {
  string space_id = 1;
}

message TerminalSessionRecord {
  string session_id = 1;
  string space_id = 2;
  string execution_context_id = 3;
  string title = 4;
  string tmux_session_name = 5;
  string pane_id = 6;
  string initial_command = 7;
  int64 created_at_millis = 8;
}

message ListTerminalSessionsResponse {
  repeated TerminalSessionRecord sessions = 1;
}

// Filesystem paths are always relative to the execution-context root. The Host
// resolves and validates them; neither request nor response carries a local path.
message ListContextFilesQuery {
  string execution_context_id = 1;
  string relative_path = 2;
  bool include_hidden = 3;
}

message ContextFileEntryRecord {
  string relative_path = 1;
  string name = 2;
  bool is_directory = 3;
}

message ListContextFilesResponse {
  repeated ContextFileEntryRecord entries = 1;
}

message ReadContextTextFileQuery {
  string execution_context_id = 1;
  string relative_path = 2;
}

message ReadContextTextFileResponse {
  string relative_path = 1;
  string text = 2;
  string content_hash = 3;
}

message ReplaceContextTextFileCommand {
  string execution_context_id = 1;
  string relative_path = 2;
  string expected_content_hash = 3;
  string text = 4;
}

message ReplaceContextTextFileResult {
  string relative_path = 1;
  string content_hash = 2;
}

message CreateTerminalSessionCommand {
  string terminal_session_id = 1;
  string space_id = 2;
  string execution_context_id = 3;
  string title = 4;
  string initial_command = 5;
}

message CreateTerminalSessionResult {
  TerminalSessionRecord session = 1;
}

message AttachTerminalQuery {
  string terminal_session_id = 1;
  uint64 after_sequence = 2;
  uint32 scrollback_bytes = 3;
  uint32 columns = 4;
  uint32 rows = 5;
}

message AttachTerminalResponse {
  string terminal_session_id = 1;
  uint64 sequence = 2;
  bytes output = 3;
  bool truncated = 4;
}

// Remote control is bound to the authenticated Device by the Host session; no
// request carries a claimed controller identity or a shell command.
message AcquireTerminalControlCommand {
  string terminal_session_id = 1;
  uint32 lease_seconds = 2;
}

message ReleaseTerminalControlCommand {
  string terminal_session_id = 1;
}

message TerminalControlLeaseResult {
  string terminal_session_id = 1;
  string controller_device_id = 2;
  int64 expires_at_millis = 3;
}

message TerminalInputCommand {
  string terminal_session_id = 1;
  uint64 sequence = 2;
  bytes input = 3;
}

message TerminalResizeCommand {
  string terminal_session_id = 1;
  uint64 sequence = 2;
  uint32 columns = 3;
  uint32 rows = 4;
}

// Acknowledges terminal traffic after the Host runtime has accepted it. Sequence
// is zero only for release, which has no ordered terminal operation.
message TerminalOperationResult {
  string terminal_session_id = 1;
  uint64 sequence = 2;
}

message CreateLocalFolderContextCommand {
  string space_id = 1;
  string resource_id = 2;
}

message CreateLocalFolderContextResult {
  string execution_context_id = 1;
}

message CreateRepositoryCheckoutContextCommand {
  string space_id = 1;
  string resource_id = 2;
}

message CreateRepositoryCheckoutContextResult {
  string execution_context_id = 1;
}

message CreateLinkedWorktreeContextCommand {
  string space_id = 1;
  string resource_id = 2;
  string destination_path = 3;
  string branch = 4;
  bool create_branch = 5;
  optional string base_branch = 6;
}

message CreateLinkedWorktreeContextResult {
  string execution_context_id = 1;
  string operation_id = 2;
}

message CreateIndependentContextCommand {
  string space_id = 1;
  string resource_id = 2;
  string destination_path = 3;
  string mode = 4;
}

message CreateIndependentContextResult {
  string execution_context_id = 1;
  string operation_id = 2;
}

message AttachExecutionContextCommand {
  string session_id = 1;
  string execution_context_id = 2;
}

message DetachExecutionContextCommand {
  string session_id = 1;
}

message RemoveExecutionContextCommand {
  string execution_context_id = 1;
}

message ExecutionContextMutationResult {}

message SnapshotRequest {
  string scope = 1;
  uint64 after_cursor = 2;
}

message SnapshotResponse {
  string scope = 1;
  uint64 cursor = 2;
  bytes snapshot = 3;
}

message Event {
  uint64 cursor = 1;
  string event_id = 2;
}

message ReadJournalEventsQuery {
  uint64 after_cursor = 1;
  string space_id = 2;
}

message JournalEventRecord {
  uint64 cursor = 1;
  string event_id = 2;
  string space_id = 3;
  string aggregate_id = 4;
  string aggregate_type = 5;
  uint64 aggregate_revision = 6;
  int64 occurred_at_millis = 7;
  string payload_identifier = 8;
  uint32 payload_schema_version = 9;
  bytes payload_bytes = 10;
  string durability = 11;
}

message ReadJournalEventsResponse {
  repeated JournalEventRecord events = 1;
  uint64 oldest_cursor = 2;
  uint64 latest_cursor = 3;
  bool snapshot_required = 4;
}

message Ping {
  uint64 nonce = 1;
}

message Close {
  string code = 1;
  string reason = 2;
}

message BlobDescriptor {
  string blob_id = 1;
  uint64 byte_count = 2;
  bytes sha256 = 3;
}

message BlobChunk {
  string blob_id = 1;
  uint64 offset = 2;
  bytes bytes = 3;
  bool final_chunk = 4;
}
