syntax = "proto3";

package aizen.wire.v1;

option swift_prefix = "AizenWireV1_";

message ProtocolEnvelope {
  uint32 protocol_generation = 1;
  string message_id = 2;
  string connection_id = 3;
  uint64 connection_sequence = 4;
  MessageKind kind = 5;
  LogicalChannel channel = 6;
  string correlation_id = 7;
  Acknowledgement acknowledgement = 8;
  TypedPayload payload = 9;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_HELLO = 1;
  MESSAGE_KIND_AUTHENTICATION = 2;
  MESSAGE_KIND_CAPABILITIES = 3;
  MESSAGE_KIND_COMMAND = 4;
  MESSAGE_KIND_COMMAND_RECEIPT = 5;
  MESSAGE_KIND_COMMAND_RESULT = 6;
  MESSAGE_KIND_QUERY = 7;
  MESSAGE_KIND_QUERY_RESPONSE = 8;
  MESSAGE_KIND_SNAPSHOT = 9;
  MESSAGE_KIND_EVENT = 10;
  MESSAGE_KIND_EVENT_ACKNOWLEDGEMENT = 11;
  MESSAGE_KIND_PING = 12;
  MESSAGE_KIND_PONG = 13;
  MESSAGE_KIND_CLOSE = 14;
  MESSAGE_KIND_BLOB = 15;
  MESSAGE_KIND_ERROR = 16;
}

enum LogicalChannel {
  LOGICAL_CHANNEL_UNSPECIFIED = 0;
  LOGICAL_CHANNEL_CONTROL = 1;
  LOGICAL_CHANNEL_STATE = 2;
  LOGICAL_CHANNEL_RUN_STREAM = 3;
  LOGICAL_CHANNEL_TERMINAL = 4;
  LOGICAL_CHANNEL_BLOB = 5;
}

enum PayloadEncoding {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_PROTOBUF = 1;
}

message Acknowledgement {
  uint64 sequence = 1;
  string message_id = 2;
}

message TypedPayload {
  string type = 1;
  uint32 schema_version = 2;
  PayloadEncoding encoding = 3;
  bytes bytes = 4;
  bool state_affecting = 5;
}

message Hello {
  uint32 minimum_protocol_generation = 1;
  uint32 maximum_protocol_generation = 2;
  string product_version = 3;
}

message Capabilities {
  repeated string identifiers = 1;
}

message CommandReceipt {
  string command_id = 1;
  string operation_id = 2;
}

message CommandResult {
  string command_id = 1;
  bool succeeded = 2;
  string error_code = 3;
}

message CreateSpaceCommand {
  string name = 1;
  string icon = 2;
  string summary = 3;
}

message CreateSpaceResult {
  string space_id = 1;
}

message RenameSpaceCommand {
  string space_id = 1;
  string name = 2;
}

message DeleteSpaceCommand {
  string space_id = 1;
}

message SpaceMutationResult {}

message CreateConversationCommand {
  string space_id = 1;
  string title = 2;
}

message CreateConversationResult {
  string session_id = 1;
}

message SendConversationCommand {
  string space_id = 1;
  string session_id = 2;
  string message_id = 3;
  string run_id = 4;
  string content = 5;
}

message SendConversationResult {
  string run_id = 1;
}

message CancelRunCommand {
  string run_id = 1;
}

message CancelRunResult {}

message ListSpacesQuery {}

message SpaceRecord {
  string space_id = 1;
  string name = 2;
  string icon = 3;
  string summary = 4;
}

message ListSpacesResponse {
  repeated SpaceRecord spaces = 1;
}

message ListConversationsQuery {
  string space_id = 1;
}

message ConversationRecord {
  string session_id = 1;
  string space_id = 2;
  string title = 3;
  string lifecycle = 4;
}

message ListConversationsResponse {
  repeated ConversationRecord conversations = 1;
}

message GetConversationTimelineQuery {
  string session_id = 1;
}

message ConversationMessageRecord {
  string message_id = 1;
  string space_id = 2;
  string session_id = 3;
  string run_id = 4;
  string role = 5;
  string content = 6;
  int64 created_at_millis = 7;
}

message GetConversationTimelineResponse {
  repeated ConversationMessageRecord messages = 1;
}

message ListRunsQuery {
  string space_id = 1;
}

message RunRecord {
  string run_id = 1;
  string space_id = 2;
  string session_id = 3;
  string execution_context_id = 4;
  string lifecycle = 5;
}

message ListRunsResponse {
  repeated RunRecord runs = 1;
}

message ListResourcesQuery {
  string space_id = 1;
}

message ResourceRecord {
  string resource_id = 1;
  string space_id = 2;
  string kind = 3;
  string title = 4;
}

message ListResourcesResponse {
  repeated ResourceRecord resources = 1;
}

message ImportLocalFolderCommand {
  string space_id = 1;
  string path = 2;
  string title = 3;
}

message ImportLocalFolderResult {
  string resource_id = 1;
}

message RemoveResourceCommand {
  string resource_id = 1;
}

message ResourceMutationResult {}

message ListExecutionContextsQuery {
  string space_id = 1;
  string resource_id = 2;
}

message ExecutionContextRecord {
  string execution_context_id = 1;
  string space_id = 2;
  string resource_id = 3;
  string kind = 4;
}

message ListExecutionContextsResponse {
  repeated ExecutionContextRecord contexts = 1;
}

message CreateLocalFolderContextCommand {
  string space_id = 1;
  string resource_id = 2;
}

message CreateLocalFolderContextResult {
  string execution_context_id = 1;
}

message AttachExecutionContextCommand {
  string session_id = 1;
  string execution_context_id = 2;
}

message ExecutionContextMutationResult {}

message SnapshotRequest {
  string scope = 1;
  uint64 after_cursor = 2;
}

message SnapshotResponse {
  string scope = 1;
  uint64 cursor = 2;
  bytes snapshot = 3;
}

message Event {
  uint64 cursor = 1;
  string event_id = 2;
}

message Ping {
  uint64 nonce = 1;
}

message Close {
  string code = 1;
  string reason = 2;
}

message BlobDescriptor {
  string blob_id = 1;
  uint64 byte_count = 2;
  bytes sha256 = 3;
}

message BlobChunk {
  string blob_id = 1;
  uint64 offset = 2;
  bytes bytes = 3;
  bool final_chunk = 4;
}
